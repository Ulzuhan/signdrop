services:
  signdrop:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/ulzuhan/signdrop:latest
    container_name: signdrop
    restart: unless-stopped
    ports:
      - "127.0.0.1:3466:3466"
    environment:
      - NODE_ENV=production
      - SIGNDROP_PORT=3466
      - SIGNDROP_HOST=0.0.0.0
      - SIGNDROP_PUBLIC_HOST=${SIGNDROP_PUBLIC_HOST:-localhost:3466}
      - SIGNDROP_SESSION_SECRET=${SIGNDROP_SESSION_SECRET:-}
      - SIGNDROP_OIDC_CLIENT_ID=${SIGNDROP_OIDC_CLIENT_ID:-}
      - SIGNDROP_OIDC_CLIENT_SECRET=${SIGNDROP_OIDC_CLIENT_SECRET:-}
      - SIGNDROP_OIDC_DISCOVERY_URL=${SIGNDROP_OIDC_DISCOVERY_URL:-}
      - SIGNDROP_OIDC_REDIRECT_URI=${SIGNDROP_OIDC_REDIRECT_URI:-}
      - SIGNDROP_DOCDROP_URL=${SIGNDROP_DOCDROP_URL:-https://docdrop.kaicorplabs.com}
      - KAICORP_FOOTER_LINKS=1
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
