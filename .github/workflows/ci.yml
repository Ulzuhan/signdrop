name: CI

# What this proves, in order of how much it matters:
#
#   1. A PDF signed by SignDrop is accepted by verifiers that are not ours.
#      `pdfsig` (poppler) and `qpdf --check` are installed for exactly that.
#      Our own suite passing only proves we agree with ourselves.
#   2. The behaviour suites: the verifier against what it exists to catch, the
#      trusted lists, the widget and the second signature.
#   3. Lint, types and the unit specs.
#
# `tsc --noEmit` runs AFTER `next build`, because Next generates the types the
# routes rely on during the build. Running it first fails on every dynamic
# route with TS2304.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      digest:
        value: ${{ jobs.container.outputs.digest }}
      source:
        value: ${{ jobs.container.outputs.source }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # A throwaway secret so the suites can seal a session. It opens nothing:
      # the server it belongs to lives ninety seconds and dies.
      SIGNDROP_SESSION_SECRET: ci-only-signdrop-secret-at-least-32-bytes

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # node:24 to match the runtime image in the Dockerfile.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Verifiers that are not ours
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils qpdf

      - name: OCI contract and disabled publication gates
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/release-policy.py

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npx tsc --noEmit

      - name: Unit specs and the behaviour suites
        run: npm test

      # The claim the whole product rests on, checked by somebody else's code.
      - name: A signature poppler accepts, and a file qpdf finds sound
        run: |
          npx tsx scripts/sample-signed-pdf.mjs /tmp/signed.pdf
          echo '── pdfsig ──'
          pdfsig /tmp/signed.pdf | tee /tmp/pdfsig.txt
          grep -q 'Signature is Valid' /tmp/pdfsig.txt
          grep -q 'Total document signed' /tmp/pdfsig.txt
          # pdfsig writes its complaints about malformed structure to stderr
          # and still exits 0, so the absence of them is what is asserted.
          if pdfsig /tmp/signed.pdf 2>&1 >/dev/null | grep -i 'syntax error'; then
            echo 'pdfsig reported a syntax error in a PDF we wrote'
            exit 1
          fi
          echo '── qpdf ──'
          qpdf --check /tmp/signed.pdf

      - name: Two signatures, and the first one still standing
        run: |
          npx tsx scripts/sample-twice-signed.mjs /tmp/twice.pdf
          pdfsig /tmp/twice.pdf | tee /tmp/twice.txt
          test "$(grep -c 'Signature is Valid' /tmp/twice.txt)" -eq 2
          grep -q 'Not total document signed' /tmp/twice.txt   # the first covers its own revision
          qpdf --check /tmp/twice.pdf

      - name: Who gets in
        run: npm run test:acceso

      - name: The provider's logout notice
        run: npm run test:backchannel

      - name: The content policy, and no inline styles coming back
        run: npm run test:csp

      # Last because it is the slowest, and because everything above has to
      # hold before "a person can actually do this" is worth asking.
      - name: Install the browsers
        run: npx playwright install --with-deps chromium webkit

      - name: A contract signed and checked, on a desktop and on a phone
        run: npm run test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  container:
    name: Exact OCI, scan and isolated runtime (no publication)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      digest: ${{ steps.artifact.outputs.digest }}
      source: ${{ steps.artifact.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - id: artifact
        uses: ./.github/actions/scanned-oci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: exact-oci-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  artifact-roundtrip:
    needs: container
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signdrop-oci-${{ github.run_id }}
          path: ${{ runner.temp }}/transfer
      - name: Verify transferred OCI bytes without rebuild or registry write
        env:
          DIGEST: ${{ needs.container.outputs.digest }}
          SOURCE: ${{ needs.container.outputs.source }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y skopeo
          test "$(cat "$RUNNER_TEMP/transfer/signdrop-oci-source.txt")" = "$SOURCE"
          test "$(cat "$RUNNER_TEMP/transfer/signdrop-oci-digest.txt")" = "$DIGEST"
          tar -C "$RUNNER_TEMP/transfer" -xf "$RUNNER_TEMP/transfer/signdrop-oci.tar"
          python3 scripts/oci-release.py verify --layout "$RUNNER_TEMP/transfer/signdrop.oci" --digest "$DIGEST" --source "$SOURCE"
