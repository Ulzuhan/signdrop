name: Build and verify the scanned OCI artifact
description: One OCI, browser signing, synthetic restart/return, scan and byte verification; never publishes
inputs:
  labels:
    description: Additional metadata labels
    required: false
    default: ''
outputs:
  digest:
    description: Exact tested and scanned OCI index
    value: ${{ steps.build.outputs.digest }}
  layout:
    description: OCI layout
    value: ${{ runner.temp }}/signdrop.oci
  source:
    description: Exact checked out source
    value: ${{ steps.source.outputs.sha }}
runs:
  using: composite
  steps:
    - id: source
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - id: policy
      name: Enforce disabled release lane and derive preparation labels
      shell: bash
      run: |
        python3 scripts/release-policy.py
        echo 'labels<<SIGNDROP_LABELS' >> "$GITHUB_OUTPUT"
        python3 scripts/release-policy.py --labels >> "$GITHUB_OUTPUT"
        echo 'SIGNDROP_LABELS' >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64
        outputs: type=oci,dest=${{ runner.temp }}/signdrop.oci,tar=false
        tags: signdrop:release-candidate
        labels: |
          ${{ inputs.labels }}
          org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          io.kaicorp.signdrop.store-contract=browser-storage-v1
          io.kaicorp.signdrop.data-action=image-only
          io.kaicorp.signdrop.auth-contract=sealed-session-v1
          io.kaicorp.signdrop.readiness-contract=session-identity-assets-v1
          ${{ steps.policy.outputs.labels }}
        provenance: mode=max
        sbom: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        no-cache: ${{ startsWith(github.ref, 'refs/tags/') }}
    - name: Trivy before any registry write, unchanged blocking policy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        input: ${{ runner.temp }}/signdrop.oci
        version: v0.75.0
        scanners: vuln
        format: table
        exit-code: '1'
        severity: HIGH,CRITICAL
        ignore-unfixed: true
      env:
        TRIVY_TIMEOUT: 20m
    - name: Install isolated rehearsal and OCI inspection tools
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install --no-install-recommends -y skopeo
    - id: runtime
      name: Verify every OCI byte and load the exact config ID
      shell: bash
      run: |
        image_id=$(python3 scripts/oci-release.py load --layout "$RUNNER_TEMP/signdrop.oci" --digest '${{ steps.build.outputs.digest }}' --source '${{ steps.source.outputs.sha }}')
        echo "SIGNDROP_TEST_IMAGE=$image_id" >> "$GITHUB_ENV"
    - name: Exact runtime signing plus synthetic restart and configuration-failure return
      shell: bash
      run: python3 scripts/image-rehearsal.py --image "$SIGNDROP_TEST_IMAGE" --report "$RUNNER_TEMP/signdrop-image-report.json"
    - name: Default runtime identity is uid 10001
      shell: bash
      run: docker run --rm --entrypoint sh "$SIGNDROP_TEST_IMAGE" -c 'test "$(id -u)" = 10001'
    - name: Archive exact layout for byte-preserving transfer
      shell: bash
      run: |
        python3 scripts/oci-release.py verify --layout "$RUNNER_TEMP/signdrop.oci" --digest '${{ steps.build.outputs.digest }}' --source '${{ steps.source.outputs.sha }}'
        tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/signdrop-oci.tar" signdrop.oci
        printf '%s\n' '${{ steps.source.outputs.sha }}' > "$RUNNER_TEMP/signdrop-oci-source.txt"
        printf '%s\n' '${{ steps.build.outputs.digest }}' > "$RUNNER_TEMP/signdrop-oci-digest.txt"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: signdrop-oci-${{ github.run_id }}
        path: |
          ${{ runner.temp }}/signdrop-oci.tar
          ${{ runner.temp }}/signdrop-oci-source.txt
          ${{ runner.temp }}/signdrop-oci-digest.txt
          ${{ runner.temp }}/signdrop-image-report.json
        compression-level: 0
        retention-days: 7
        if-no-files-found: error
